<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Support — Web Client</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    [hidden] { display: none !important; }
    body {
      font-family: Roboto, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #202124;
      color: #e8eaed;
      overflow: hidden;
    }

    /* ---- transient status / error chips (top-left) ---- */
    #statusChip {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 60;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      max-width: 60vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #identity { color: #9aa0a6; }
    #identity:not(:empty)::before { content: " · "; }
    #error {
      position: fixed;
      top: 42px;
      left: 10px;
      z-index: 60;
      color: #ff6b6b;
      font-size: 13px;
      white-space: pre-wrap;
      max-width: 70vw;
    }

    /* ---- pre-join / auth overlay ---- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #202124;
      overflow-y: auto;
      padding: 1rem 0;
    }
    .card {
      text-align: center;
      max-width: 380px;
      padding: 2rem;
      background: #292a2d;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }
    .card h1 { font-size: 1.3rem; font-weight: 500; margin: 0 0 0.5rem; }
    .card p { color: #9aa0a6; font-size: 0.9rem; margin: 0 0 1.25rem; }
    #googleSignIn {
      font: inherit;
      font-weight: 600;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 20px;
      background: #8ab4f8;
      color: #202124;
      cursor: pointer;
    }
    #googleSignIn:hover { background: #a8c7fa; }
    #googleSignIn:disabled { opacity: 0.5; cursor: default; }
    #prejoinForm { display: flex; flex-direction: column; gap: 0.75rem; }
    #nameInput {
      background: #202124;
      color: #e8eaed;
      border: 1px solid #5f6368;
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      font-size: 0.95rem;
    }
    #joinCallBtn, #copyLinkBtn {
      background: #8ab4f8;
      color: #202124;
      border: none;
      border-radius: 20px;
      padding: 0.6rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }
    #joinCallBtn:disabled { opacity: 0.5; cursor: default; }
    #copyLinkBtn, #viewRecsBtn { background: transparent; color: #8ab4f8; border: 1px solid #5f6368; }
    #viewRecsBtn {
      border-radius: 20px;
      padding: 0.6rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }
    #recordings { z-index: 110; }
    #settings { z-index: 105; background: rgba(0, 0, 0, 0.6); }
    #settings .card { width: min(420px, calc(100vw - 2rem)); text-align: left; }
    #settings header { display: flex; align-items: center; margin-bottom: 0.75rem; }
    #settings header h1 { flex: 1; margin: 0; }
    #settings header button, #settingsRecsBtn {
      background: transparent; color: #8ab4f8; border: 1px solid #5f6368;
      border-radius: 16px; padding: 0.35rem 0.9rem; cursor: pointer; font: inherit;
    }
    #settingsRecsBtn { margin-top: 1rem; width: 100%; }
    .devices { display: flex; flex-direction: column; gap: 0.6rem; text-align: left; margin-bottom: 1rem; }
    .devices label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; color: #9aa0a6; }
    .devices select {
      background: #202124; color: #e8eaed; border: 1px solid #5f6368;
      border-radius: 6px; padding: 0.45rem 0.5rem; font-size: 0.9rem; max-width: 100%;
    }
    #prejoinPreview {
      width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000;
      border-radius: 10px; margin-bottom: 0.75rem; transform: scaleX(-1);
    }
    #prejoinPreview.no-mirror { transform: none; }
    #recordings .card { max-width: 720px; width: calc(100vw - 2rem); max-height: 85vh; overflow-y: auto; text-align: left; }
    #recordings header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    #recordings header h1 { flex: 1; margin: 0; }
    #recordings header button {
      background: transparent; color: #8ab4f8; border: 1px solid #5f6368;
      border-radius: 16px; padding: 0.3rem 0.8rem; cursor: pointer;
    }
    #recList { list-style: none; margin: 0; padding: 0; }
    #recList li { border-top: 1px solid #3c4043; padding: 0.75rem 0; }
    #recList .rec-head { display: flex; gap: 0.75rem; align-items: baseline; flex-wrap: wrap; }
    #recList .rec-who { font-weight: 500; }
    #recList .rec-meta { color: #9aa0a6; font-size: 0.8rem; flex: 1; }
    #recList a { color: #8ab4f8; font-size: 0.85rem; }
    #recList video, #recList audio { width: 100%; margin-top: 0.5rem; border-radius: 8px; background: #000; }
    #recEmpty { color: #9aa0a6; font-size: 0.9rem; }
    #recNotice { color: #9aa0a6; font-size: 0.85rem; margin: 0 0 1rem; }
    #recNotice.active { color: #f28b82; }
    .cbtn.recording { background: #ea4335; color: #fff; }
    .cbtn.recording:hover { background: #d33426; }
    #recBadge {
      margin-left: 0.5rem;
      color: #fff;
      background: #d93025;
      border-radius: 4px;
      padding: 0 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    #callLink { font-family: monospace; font-size: 0.8rem; color: #9aa0a6; word-break: break-all; margin-bottom: 1rem; }
    #userInfo { margin-top: 0.75rem; font-size: 0.85rem; color: #9aa0a6; }

    /* ---- call layout ---- */
    #callUI { display: flex; flex-direction: column; height: 100vh; }
    #stageRow { flex: 1; display: flex; min-height: 0; padding: 8px; gap: 8px; }
    #tileGrid {
      flex: 1;
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(var(--cols, 1), 1fr);
      align-content: center;
      min-width: 0;
    }
    .tile {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      max-height: calc((100vh - 132px) / var(--rows, 1));
      margin: auto;
      background: #3c4043;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .tile.speaking {
      border-color: #8ab4f8;
      box-shadow: 0 0 14px rgba(138, 180, 248, 0.45);
    }
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tile.mirror video { transform: scaleX(-1); }
    .tile.cam-off video { display: none; }
    .avatar {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
    }
    .tile.cam-off .avatar,
    .tile.no-video .avatar { display: grid; }
    .avatar .circle {
      width: clamp(48px, 22%, 96px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: clamp(20px, 4vw, 40px);
      font-weight: 500;
      color: #fff;
    }
    .namechip {
      position: absolute;
      left: 8px;
      bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 13px;
      max-width: calc(100% - 24px);
    }
    .namechip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .namechip svg { width: 14px; height: 14px; flex: none; fill: #e8eaed; }
    .namechip .mic-off-ic { display: none; fill: #ea4335; }
    .tile.mic-off .namechip .mic-on-ic { display: none; }
    .tile.mic-off .namechip .mic-off-ic { display: block; }
    .bars { display: none; align-items: flex-end; gap: 2px; height: 12px; }
    .tile.speaking .bars { display: inline-flex; }
    .bars i {
      width: 3px;
      background: #8ab4f8;
      border-radius: 1px;
      animation: bar 0.9s ease-in-out infinite;
    }
    .bars i:nth-child(2) { animation-delay: 0.15s; }
    .bars i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bar { 0%, 100% { height: 4px; } 50% { height: 12px; } }

    /* ---- people panel ---- */
    #peoplePanel {
      width: 300px;
      flex: none;
      background: #292a2d;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #peoplePanel[hidden] { display: none; }
    #peoplePanel header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 8px 0;
      border-bottom: 1px solid #3c4043;
    }
    #peoplePanel header .tab {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      color: #9aa0a6;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 12px;
      cursor: pointer;
    }
    #peoplePanel header .tab.active {
      color: #8ab4f8;
      border-bottom-color: #8ab4f8;
    }
    #closePanelBtn {
      margin-left: auto;
      font: inherit;
      color: #9aa0a6;
      background: none;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
    }
    #closePanelBtn:hover { background: #3c4043; }
    #chatTab {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-msg { max-width: 90%; }
    .chat-msg .meta {
      font-size: 0.72rem;
      color: #9aa0a6;
      margin-bottom: 2px;
    }
    .chat-msg .body {
      background: #3c4043;
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 0.88rem;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }
    .chat-msg.mine { align-self: flex-end; }
    .chat-msg.mine .meta { text-align: right; }
    .chat-msg.mine .body { background: #8ab4f8; color: #202124; }
    #chatForm {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #3c4043;
    }
    #chatInput {
      flex: 1;
      font: inherit;
      font-size: 0.9rem;
      color: #e8eaed;
      background: #3c4043;
      border: 1px solid #5f6368;
      border-radius: 18px;
      padding: 8px 14px;
      outline: none;
    }
    #chatInput:focus { border-color: #8ab4f8; }
    #chatSend {
      font: inherit;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      background: #8ab4f8;
      color: #202124;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex: none;
    }
    #chatSend svg { width: 18px; height: 18px; fill: currentColor; }
    #chatSend:disabled { opacity: 0.5; cursor: default; }
    #peopleList { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
    #peopleList li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
    }
    #peopleList li.speaking { background: rgba(138, 180, 248, 0.12); }
    #peopleList .pcircle {
      width: 32px;
      height: 32px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }
    #peopleList .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem; }
    #peopleList .prole { color: #9aa0a6; font-size: 0.75rem; }
    #peopleList svg { width: 16px; height: 16px; flex: none; fill: #9aa0a6; }
    #peopleList li.mic-off svg.pmic { fill: #ea4335; }

    /* ---- control bar ---- */
    #controlBar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 14px 12px 18px;
    }
    .cbtn {
      position: relative;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #3c4043;
      color: #e8eaed;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s;
    }
    .cbtn:hover { background: #4a4f53; }
    .cbtn svg { width: 22px; height: 22px; fill: currentColor; }
    .cbtn .ic-off { display: none; }
    .cbtn.off { background: #ea4335; color: #fff; }
    .cbtn.off:hover { background: #d33426; }
    .cbtn.off .ic-on { display: none; }
    .cbtn.off .ic-off { display: block; }
    .cbtn:disabled { opacity: 0.5; cursor: default; }
    .cbtn.hangup {
      width: 64px;
      border-radius: 24px;
      background: #ea4335;
      color: #fff;
    }
    .cbtn.hangup:hover { background: #d33426; }
    .cbtn.toggled { background: #8ab4f8; color: #202124; }
    .cbtn.toggled:hover { background: #a8c7fa; }
    /* Device chooser: small arrow on the mic/camera buttons (Meet style). */
    .cgroup { position: relative; display: inline-flex; }
    .chev {
      position: absolute; top: -6px; right: -6px; z-index: 2;
      width: 22px; height: 22px; border-radius: 50%; padding: 0;
      border: 2px solid #202124; background: #5f6368; color: #e8eaed;
      font-size: 9px; line-height: 1; cursor: pointer;
    }
    .chev:hover, .chev.open { background: #8ab4f8; color: #202124; }
    #deviceMenu {
      position: fixed; z-index: 90; min-width: 220px; max-width: calc(100vw - 16px);
      background: #292a2d; border-radius: 10px; padding: 6px 0;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }
    #deviceMenu h2 { font-size: 0.75rem; font-weight: 500; color: #9aa0a6; margin: 6px 14px 4px; }
    #deviceMenu button {
      display: flex; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: 0.9rem;
      background: none; border: none; color: #e8eaed; padding: 8px 14px; cursor: pointer;
    }
    #deviceMenu button:hover { background: #3c4043; }
    #deviceMenu .check { width: 1em; color: #8ab4f8; }
    #deviceMenu button.danger { color: #f28b82; }
    #deviceMenu .empty { color: #9aa0a6; font-size: 0.85rem; padding: 6px 14px; }
    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: #8ab4f8;
      color: #202124;
      font-size: 11px;
      font-weight: 600;
      display: grid;
      place-items: center;
      padding: 0 4px;
    }
    /* ---- phones / narrow windows ---- */
    @media (max-width: 600px) {
      #controlBar { gap: 4px; padding: 8px 6px 12px; flex-wrap: wrap; }
      .cbtn { width: 40px; height: 40px; }
      .cbtn svg { width: 20px; height: 20px; }
      .cbtn.hangup { width: 52px; }
      #stageRow { padding: 4px; }
      #tileGrid { gap: 4px; }
      .tile { max-height: calc((100vh - 110px) / var(--rows, 1)); }
      #peoplePanel { position: fixed; inset: 0 0 64px 0; width: auto; max-width: none; z-index: 70; }
      .card { padding: 1.25rem; margin: 0 0.75rem; }
      #statusChip { max-width: calc(100vw - 20px); }
    }
    @media (max-width: 360px) {
      #controlBar { gap: 3px; padding: 8px 4px 10px; }
      .cbtn { width: 34px; height: 34px; }
      .cbtn svg { width: 18px; height: 18px; }
      .cbtn.hangup { width: 44px; }
    }
  </style>
</head>
<body>
  <div id="statusChip"><span id="status">Initializing…</span><span id="identity"></span><span id="recBadge" hidden>REC</span></div>
  <div id="error"></div>

  <div id="callUI" hidden>
    <div id="stageRow">
      <div id="tileGrid"></div>
      <aside id="peoplePanel" hidden>
        <header>
          <button id="tabPeople" class="tab active" type="button">People</button>
          <button id="tabChatBtn" class="tab" type="button">Chat</button>
          <button id="closePanelBtn" type="button" title="Close">✕</button>
        </header>
        <ul id="peopleList"></ul>
        <div id="chatTab" hidden>
          <div id="chatMessages"></div>
          <form id="chatForm">
            <input id="chatInput" type="text" placeholder="Send a message" autocomplete="off" />
            <button id="chatSend" type="submit" title="Send">
              <svg viewBox="0 0 24 24"><use href="#i-send"/></svg>
            </button>
          </form>
        </div>
      </aside>
    </div>
    <div id="controlBar">
      <button id="muteAllBtn" class="cbtn" type="button" title="Mute microphone and camera"></button>
      <span class="cgroup">
        <button id="micBtn" class="cbtn" type="button" title="Toggle microphone"></button>
        <button id="micMenuBtn" class="chev" type="button" title="Choose microphone and speaker" data-kinds="audioinput,audiooutput">&#9650;</button>
      </span>
      <span class="cgroup">
        <button id="camBtn" class="cbtn" type="button" title="Toggle camera"></button>
        <button id="camMenuBtn" class="chev" type="button" title="Choose camera" data-kinds="videoinput">&#9650;</button>
      </span>
      <button id="hangupBtn" class="cbtn hangup" type="button" title="Hang up"></button>
      <button id="recBtn" class="cbtn" type="button" title="Start recording" hidden></button>
      <button id="peopleBtn" class="cbtn" type="button" title="Show everyone"></button>
      <button id="chatBtn" class="cbtn" type="button" title="Chat with everyone"></button>
      <button id="settingsBtn" class="cbtn" type="button" title="Settings: microphone, camera, speaker"></button>
    </div>
  </div>

  <div id="auth" class="overlay" hidden>
    <div class="card">
      <h1>Remote Support</h1>
      <p>Sign in with your Google account to join this support session.</p>
      <button id="googleSignIn" type="button">Sign in with Google</button>
      <div id="userInfo"></div>
    </div>
  </div>

  <div id="prejoin" class="overlay" hidden>
    <div class="card">
      <h1>Ready to join?</h1>
      <p>Anyone with this link can join the call.</p>
      <video id="prejoinPreview" autoplay playsinline muted></video>
      <div id="prejoinDevices" class="devices"></div>
      <div id="callLink"></div>
      <p id="recNotice" hidden></p>
      <form id="prejoinForm">
        <input id="nameInput" type="text" placeholder="Your name" maxlength="64" autocomplete="name" />
        <button id="joinCallBtn" type="submit">Join now</button>
        <button id="copyLinkBtn" type="button">Copy joining link</button>
        <button id="viewRecsBtn" type="button" hidden>View recordings</button>
      </form>
    </div>
  </div>

  <div id="deviceMenu" role="menu" hidden></div>

  <div id="settings" class="overlay" hidden>
    <div class="card">
      <header>
        <h1>Settings</h1>
        <button id="settingsCloseBtn" type="button">Done</button>
      </header>
      <div id="settingsDevices" class="devices"></div>
      <button id="settingsRecsBtn" type="button" hidden>View recordings</button>
    </div>
  </div>

  <div id="recordings" class="overlay" hidden>
    <div class="card">
      <header>
        <h1>Recordings</h1>
        <button id="recRefreshBtn" type="button">Refresh</button>
        <button id="recCloseBtn" type="button">Close</button>
      </header>
      <p id="recEmpty" hidden>No recordings for this call yet.</p>
      <ul id="recList"></ul>
    </div>
  </div>

  <div id="endCard" class="overlay" hidden>
    <div class="card">
      <h1 id="endTitle">You left the call</h1>
      <p id="endDetail"></p>
      <button id="rejoinBtn" type="button" onclick="location.reload()">Rejoin</button>
    </div>
  </div>

  <!-- Shared inline SVG symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-rec" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-13a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></symbol>
