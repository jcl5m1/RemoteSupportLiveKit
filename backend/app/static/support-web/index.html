<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Support — Web Client</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #111;
      color: #eee;
    }
    #status {
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    #error {
      color: #ff6b6b;
      white-space: pre-wrap;
    }
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.5rem;
      margin-top: 1rem;
    }
    video {
      width: 100%;
      max-width: 480px;
      background: #222;
      border-radius: 8px;
    }
    .label {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div id="status">Initializing…</div>
  <div id="error"></div>
  <div id="identity"></div>
  <div class="videos">
    <div>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="label">Local</div>
    </div>
    <div>
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label">Remote</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.x/dist/livekit-client.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
