[project]
name = "remote-support-backend"
version = "0.1.0"
description = "Token minting, session registry, egress orchestration and transcript storage for RemoteSupportLiveKit"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "livekit-api>=1.0",
    "google-cloud-storage>=2.18",
    "pyjwt[crypto]>=2.9",  # also verifies Firebase ID tokens via PyJWKClient
    "python-ulid>=3.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: Depends(...) in default arguments is standard FastAPI.
# UP042: (str, enum.Enum) is the SQLAlchemy-compatible spelling; StrEnum values
# are not picked up correctly by SQLAlchemy's Enum in the installed version.
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
