name: E2E regression — two web clients

# Tests marked `quota` (AI agent inference, recording egress) spend LiveKit
# Cloud's monthly quota -- a hard cap on the free plan, shared with real calls --
# so they run weekly; the rest run nightly with the agent and recording off.
on:
  schedule:
    - cron: "17 7 * * *"   # nightly: calling tests only
    - cron: "43 8 * * 1"   # weekly (Monday): everything, incl. quota tests
  workflow_dispatch:
    inputs:
      include_quota:
        description: "Also run tests that spend LiveKit Cloud quota (agent, recording)"
        type: boolean
        default: false

jobs:
  two-web-clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    env:
      BACKEND_URL: ${{ secrets.E2E_BACKEND_URL }}
      SERVICE_API_KEY: ${{ secrets.E2E_SERVICE_API_KEY }}
      LIVEKIT_URL: ${{ secrets.E2E_LIVEKIT_URL }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Run e2e tests
        env:
          WEEKLY: ${{ github.event.schedule == '43 8 * * 1' }}
          INCLUDE_QUOTA: ${{ inputs.include_quota }}
        run: |
          if [ "$WEEKLY" = true ] || [ "$INCLUDE_QUOTA" = true ]; then
            echo "Running all tests, including those that spend LiveKit Cloud quota"
            pytest test_two_web_clients.py -q
          else
            echo "Running calling tests only (quota tests run weekly)"
            pytest test_two_web_clients.py -q -m "not quota"
          fi
