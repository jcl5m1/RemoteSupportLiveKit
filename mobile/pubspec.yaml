name: remote_support
description: Two-party support video calling with an AI voice agent.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # LiveKit
  livekit_client: ^2.13.2
  flutter_webrtc: ^1.6.3 # native audio routing (mic/speaker/Bluetooth), torch, frames

  # State + networking
  flutter_riverpod: ^2.5.0
  dio: ^5.4.0

  # Quick join
  app_links: ^6.3.0 # deep links + universal links
  mobile_scanner: ^5.2.0 # QR scan (support)
  qr_flutter: ^4.1.0 # QR render (caller)

  # Support auth — Google SSO via Firebase (support role only; callers stay
  # anonymous). See docs/08-security-compliance.md.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.0

  # Platform
  permission_handler: ^11.3.0
  wakelock_plus: ^1.2.0
  flutter_secure_storage: ^9.2.0
  share_plus: ^10.0.0
  webview_flutter: ^4.14.1
  video_player: ^2.14.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
