[project]
name = "remote-support-agent"
version = "0.1.0"
description = "LiveKit voice agent worker: caller-bound responses, dual transcription"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Pin exactly. The agents API has moved fast (docs/10 § API surface drift).
    "livekit-agents==1.6.10",
    # STT/LLM/TTS all resolve through LiveKit Cloud Inference via model
    # identifier strings, so the per-vendor plugins are NOT needed. Adding
    # livekit-plugins-deepgram / -openai / -cartesia would reintroduce
    # per-provider API keys and a second bill -- which is exactly what routing
    # through Inference is meant to avoid.
    #
    # These two are local/LiveKit-native, not vendor gateways, so they stay:
    "livekit-plugins-silero",              # VAD, runs locally
    "livekit-plugins-noise-cancellation",  # LiveKit BVC
    "pydantic-settings>=2.6",
    "python-ulid>=3.0",
    "httpx>=0.27",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # Synthetic loop-back test harness (test_translation_loopback.py):
    # edge-tts generates the multilingual speech, faster-whisper recognizes it,
    # opencc normalizes Traditional/Simplified differences in scoring.
    "edge-tts>=7.0",
    "faster-whisper>=1.0",
    # faster-whisper decode_audio passes metadata_errors= to av.open; PyAV
    # dropped that kwarg after 15.x (19.x confirmed broken), so cap the range.
    "av>=14,<16",
    "opencc-python-reimplemented>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: synthetic speech loop-back tests (network + local model download required)",
]
